    <!--PRELOADER-CSS:START-->
    <style>
      #preloader { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #0f241e; color: #f1f3ea;
        font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; transition: clip-path 0.8s cubic-bezier(0.76, 0, 0.24, 1); clip-path: inset(0 0 0 0);
        /* safety net: if scripts never run, the page is uncovered anyway */ animation: preloader-timeout 0s 7s forwards; }
      #preloader.is-done { clip-path: inset(0 0 100% 0); pointer-events: none; }
      /* the same rise and drop as the name in the footer */
      #preloader .mark { display: flex; align-items: baseline; overflow: hidden; padding-block: 0.06em 0.16em; font-size: clamp(64px, 12vw, 132px); font-weight: 800; font-stretch: 85%; letter-spacing: -0.04em; line-height: 0.92; }
      #preloader .mark span { display: inline-block; animation: preloader-letter 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--i) * 80ms) both; }
      #preloader .mark b { flex: none; width: 0.17em; height: 0.17em; margin-left: 0.07em; border-radius: 50%; background: #e5a912; animation: preloader-drop 1s calc(var(--i) * 80ms + 200ms) both; }
      #preloader.is-done .mark { opacity: 0; transition: opacity 0.25s; }
      @keyframes preloader-letter { from { transform: translateY(115%); } }
      @keyframes preloader-drop {
        0% { opacity: 0; transform: translateY(-0.75em); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
        45% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(0, 0.4, 0.5, 1); }
        65% { transform: translateY(-0.2em); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
        82% { transform: none; animation-timing-function: cubic-bezier(0, 0.4, 0.5, 1); }
        91% { transform: translateY(-0.05em); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes preloader-timeout { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #preloader, #preloader * { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } #preloader { animation: preloader-timeout 0s 7s forwards; } }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
    <!--PRELOADER-CSS:END-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
